apiVersion: v1
kind: ServiceAccount
metadata:
  name: pawploy-connector
  namespace: pawploy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pawploy-connector
  namespace: pawploy
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pawploy-connector
  namespace: pawploy
subjects:
  - kind: ServiceAccount
    name: pawploy-connector
    namespace: pawploy
roleRef:
  kind: Role
  name: pawploy-connector
  apiGroup: rbac.authorization.k8s.io
